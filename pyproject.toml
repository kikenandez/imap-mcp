[project]
name = "imap-mcp"
version = "0.2.0"
description = "MCP server for reading mail across IMAP accounts and creating opt-in drafts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [
    { name = "Lee Flannery" }
]
requires-python = ">=3.12"
keywords = ["mcp", "imap", "email", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "imap-tools>=1.13.0",
    "mcp[cli]>=2.0.0",
]

[project.urls]
Repository = "https://github.com/kikenandez/imap-mcp"
Issues = "https://github.com/kikenandez/imap-mcp/issues"

[project.scripts]
imap-mcp = "imap_mcp:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
