# Synthetic example only. Copy to gitignored accounts.toml and edit locally.
# Never commit actual addresses, client domains or credentials.
# Only env: and macOS keychain: password references are accepted.
# A plaintext password field is forbidden, including on disabled accounts.

[[account]]
key = "example"
label = "Example account"
email = "user@example.com"
host = "imap.example.com"              # replace locally with your provider's host
port = 993
password_ref = "env:IMAP_EXAMPLE_PASSWORD"
# macOS alternative (replace the line above):
# password_ref = "keychain:pkma-mail-example/pkma"
# Keychain generic-password service = pkma-mail-example; account = pkma.
enabled = true
timeout_seconds = 30
allow_drafts = false
# from_name = "Example User"

# Optional fallback for an existing folder with an unusual name:
# [account.folders]
# drafts = "My compositions"

# Legacy password_env = "IMAP_EXAMPLE_PASSWORD" is still supported instead of
# password_ref. Never specify both. Disabled accounts never resolve credentials.
